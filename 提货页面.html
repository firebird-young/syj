<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提货</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: #f5f6fa;
            padding-bottom: 30px;
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* 头部 */
        .header {
            background: #fff;
            padding: 44px 16px 14px;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            color: #1a1a2e;
            position: relative;
            border-bottom: 1px solid #f0f0f0;
        }
        .header .back {
            position: absolute;
            left: 16px;
            bottom: 14px;
            font-size: 22px;
            color: #4e5a6e;
            line-height: 1;
            cursor: pointer;
        }

        /* 卡片 */
        .card {
            background: #fff;
            border-radius: 12px;
            margin: 12px 16px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        /* 产品列表 */
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .product-item:last-child {
            border-bottom: none;
        }
        .product-info {
            flex: 1;
        }
        .product-name {
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
        }
        .product-spec {
            font-size: 12px;
            color: #9ba6b9;
            margin-top: 2px;
        }
        .product-qty {
            text-align: right;
        }
        .product-qty .required {
            font-size: 15px;
            font-weight: 600;
            color: #4f7cff;
        }
        .product-qty .label {
            font-size: 11px;
            color: #9ba6b9;
        }
        .product-qty .owned {
            font-size: 15px;
            font-weight: 600;
            color: #34a853;
        }
        .product-qty .owned.low {
            color: #e74c5e;
        }

        .qty-divider {
            height: 1px;
            background: #f0f0f0;
            margin: 4px 0;
        }

        /* 提取数量区 */
        .claim-section {
            margin: 12px 16px;
        }
        .claim-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .claim-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        .claim-label {
            font-size: 14px;
            color: #4e5a6e;
        }
        .claim-value {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .claim-value.highlight {
            color: #4f7cff;
            font-size: 18px;
        }

        .claim-input-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-top: 1px solid #f0f0f0;
            margin-top: 8px;
        }
        .claim-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .claim-input-wrap input {
            width: 100px;
            height: 40px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            border: 1.5px solid #e2e6ee;
            border-radius: 8px;
            outline: none;
            color: #1a1a2e;
            transition: border-color 0.2s;
        }
        .claim-input-wrap input:focus {
            border-color: #4f7cff;
        }
        .claim-input-wrap .unit {
            font-size: 13px;
            color: #9ba6b9;
        }
        .claim-hint {
            font-size: 12px;
            color: #9ba6b9;
            text-align: right;
        }
        .claim-hint strong {
            color: #4f7cff;
            font-weight: 600;
        }

        /* 按钮组 */
        .qty-adjust {
            display: inline-flex;
            align-items: center;
            gap: 0;
        }
        .qty-adjust button {
            width: 36px;
            height: 36px;
            border: 1.5px solid #e2e6ee;
            background: #fff;
            font-size: 18px;
            color: #4e5a6e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .qty-adjust button:active {
            background: #f0f2f7;
        }
        .qty-adjust button:first-child {
            border-radius: 8px 0 0 8px;
        }
        .qty-adjust button:last-child {
            border-radius: 0 8px 8px 0;
        }
        .qty-adjust button:disabled {
            color: #d0d5dd;
            cursor: not-allowed;
        }
        .qty-adjust input {
            width: 52px;
            height: 36px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border: 1.5px solid #e2e6ee;
            border-left: none;
            border-right: none;
            outline: none;
            color: #1a1a2e;
        }

        /* 收货地址 */
        .address-card {
            background: #fff;
            border-radius: 12px;
            margin: 12px 16px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .address-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .address-header .card-title {
            margin-bottom: 0;
        }
        .address-select {
            font-size: 13px;
            color: #4f7cff;
            cursor: pointer;
            font-weight: 500;
        }
        .address-info {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .address-info .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e8ecf5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #4e5a6e;
            flex-shrink: 0;
        }
        .address-detail {
            flex: 1;
        }
        .address-detail .name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .address-detail .name .phone {
            font-weight: 400;
            color: #9ba6b9;
            margin-left: 8px;
        }
        .address-detail .addr {
            font-size: 13px;
            color: #4e5a6e;
            margin-top: 4px;
            line-height: 1.4;
        }
        .address-empty {
            font-size: 14px;
            color: #9ba6b9;
            text-align: center;
            padding: 20px 0;
        }

        /* 提交按钮 */
        .submit-area {
            margin: 20px 16px 0;
        }
        .btn-submit {
            width: 100%;
            height: 48px;
            background: #4f7cff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:active {
            background: #3d68e8;
        }
        .btn-submit:disabled {
            background: #c8cedb;
            cursor: not-allowed;
        }
        .submit-hint {
            font-size: 12px;
            color: #9ba6b9;
            text-align: center;
            margin-top: 10px;
            line-height: 1.5;
            padding: 0 8px;
        }

        /* 进度展示 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #edf0f5;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #4f7cff;
            border-radius: 2px;
            transition: width 0.3s;
        }

        /* 分割标题 */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            padding: 4px 16px 0;
        }

        /* max提示 */
        .max-note {
            font-size: 11px;
            color: #e74c5e;
            margin-top: 4px;
            text-align: right;
        }
    </style>
</head>
<body>

<!-- 头部 -->
<div class="header">
    <span class="back">&larr;</span>
    提货
</div>

<!-- ===== 规则要求数量 ===== -->
<div class="card">
    <div class="card-title">任务要求</div>
    <div id="requiredList">
        <div class="product-item">
            <div class="product-info">
                <div class="product-name">仙鹤莲池</div>
                <div class="product-spec">每份需提货 10 件</div>
            </div>
            <div class="product-qty">
                <div class="required">10</div>
                <div class="label">件/份</div>
            </div>
        </div>
        <div class="product-item">
            <div class="product-info">
                <div class="product-name">进宝</div>
                <div class="product-spec">每份需提货 5 件</div>
            </div>
            <div class="product-qty">
                <div class="required">5</div>
                <div class="label">件/份</div>
            </div>
        </div>
    </div>
</div>

<!-- ===== 用户拥有数量 ===== -->
<div class="card">
    <div class="card-title">我的持有</div>
    <div id="ownedList">
        <div class="product-item">
            <div class="product-info">
                <div class="product-name">仙鹤莲池</div>
            </div>
            <div class="product-qty">
                <div class="owned">32</div>
                <div class="label">件</div>
            </div>
        </div>
        <div class="product-item">
            <div class="product-info">
                <div class="product-name">进宝</div>
            </div>
            <div class="product-qty">
                <div class="owned low">3</div>
                <div class="label">件</div>
            </div>
        </div>
    </div>
</div>

<!-- ===== 提取数量 ===== -->
<div class="claim-section">
    <div class="claim-card">
        <div class="claim-row">
            <span class="claim-label">可提取份数</span>
            <span class="claim-value highlight" id="maxClaimDisplay">3</span>
        </div>
        <div class="claim-row">
            <span class="claim-label">该任务最多可提取</span>
            <span class="claim-value" id="taskMaxDisplay">5</span>
        </div>
        <div class="progress-bar">
            <div class="fill" id="progressFill" style="width:60%;"></div>
        </div>

        <div class="claim-input-area">
            <span class="claim-label">提取份数</span>
            <div style="display:flex;align-items:center;gap:8px;">
                <div class="qty-adjust">
                    <button id="qtyMinus" onclick="adjustQty(-1)">-</button>
                    <input type="number" id="claimQtyInput" value="0" min="0" max="3" onchange="onQtyChange()">
                    <button id="qtyPlus" onclick="adjustQty(1)">+</button>
                </div>
                <span style="font-size:13px;color:#9ba6b9;">份</span>
            </div>
        </div>
        <div class="claim-hint">
            该任务您最多可提取 <strong id="maxClaimHint">3</strong> 份
        </div>
        <div class="max-note" id="maxNote">
            * 受限于您的持有数量和任务规则上限，取两者较小值
        </div>
    </div>
</div>

<!-- ===== 收货地址 ===== -->
<div class="address-card">
    <div class="address-header">
        <div class="card-title">收货地址</div>
        <span class="address-select" onclick="alert('选择地址')">更换 &gt;</span>
    </div>
    <div class="address-info">
        <div class="avatar">张</div>
        <div class="address-detail">
            <div class="name">张三 <span class="phone">138****5678</span></div>
            <div class="addr">广东省深圳市南山区科技园南区粤海街道高新大厦A座1201</div>
        </div>
    </div>
</div>

<!-- ===== 提交 ===== -->
<div class="submit-area">
    <button class="btn-submit" id="submitBtn" onclick="submitPickup()">确定提取</button>
    <div class="submit-hint">
        实物提取后预计30个工作日内发货，该数字资产将从区块链上销毁
    </div>
</div>

<script>
// ===== 模拟数据 =====
var config = {
    // 规则要求：每个产品的每份需要数量
    requirements: { crane: 10, fortune: 5 },
    // 用户持有
    holdings: { crane: 32, fortune: 3 },
    // 任务总上限
    taskMax: 5
};

var productNames = { crane: '仙鹤莲池', fortune: '进宝' };

// 计算可提取份数 = min(各产品 holdings/requirements 向下取整的最小值, taskMax)
function calcMaxClaim() {
    var maxByProduct = Infinity;
    for (var key in config.requirements) {
        var req = config.requirements[key];
        var hold = config.holdings[key] || 0;
        var can = Math.floor(hold / req);
        if (can < maxByProduct) maxByProduct = can;
    }
    var maxClaim = Math.min(maxByProduct, config.taskMax);
    return isFinite(maxClaim) ? maxClaim : 0;
}

var maxClaim = calcMaxClaim();

// 更新UI
document.getElementById('maxClaimDisplay').textContent = maxClaim;
document.getElementById('taskMaxDisplay').textContent = config.taskMax;
document.getElementById('maxClaimHint').textContent = maxClaim;
document.getElementById('claimQtyInput').max = maxClaim;

// 进度条
var progressPct = config.taskMax > 0 ? (maxClaim / config.taskMax * 100) : 0;
document.getElementById('progressFill').style.width = Math.min(progressPct, 100) + '%';

// 检查持有不足的产品
var items = document.querySelectorAll('#ownedList .product-item');
var idx = 0;
for (var key in config.holdings) {
    var req = config.requirements[key] || 0;
    var hold = config.holdings[key] || 0;
    var el = items[idx];
    if (el) {
        var qtyDiv = el.querySelector('.owned');
        qtyDiv.textContent = hold;
        if (hold < req) {
            qtyDiv.classList.add('low');
        } else {
            qtyDiv.classList.remove('low');
        }
    }
    idx++;
}

// 数量调整
function adjustQty(delta) {
    var input = document.getElementById('claimQtyInput');
    var val = parseInt(input.value) || 0;
    var newVal = val + delta;
    if (newVal < 0) newVal = 0;
    if (newVal > maxClaim) newVal = maxClaim;
    input.value = newVal;
    onQtyChange();
}

function onQtyChange() {
    var input = document.getElementById('claimQtyInput');
    var val = parseInt(input.value) || 0;
    if (val < 0) val = 0;
    if (val > maxClaim) val = maxClaim;
    input.value = val;
    updateQtyDisplay(val);
}

// 更新当前数量预览
function updateQtyDisplay(qty) {
    // 计算各产品消耗
    for (var key in config.requirements) {
        var req = config.requirements[key];
        var consumed = qty * req;
        var remain = (config.holdings[key] || 0) - consumed;
        // 找到对应的产品行
        var items = document.querySelectorAll('#ownedList .product-item');
        var found = false;
        for (var i = 0; i < items.length; i++) {
            var nameEl = items[i].querySelector('.product-name');
            if (nameEl && nameEl.textContent === productNames[key]) {
                var qtyDiv = items[i].querySelector('.owned');
                // 不修改原始数量，仅在视觉上通过颜色变化提示
                if (remain < 0) {
                    qtyDiv.style.color = '#e74c5e';
                } else if (remain < config.requirements[key]) {
                    qtyDiv.style.color = '#f59e0b';
                } else {
                    qtyDiv.style.color = '';
                }
                found = true;
                break;
            }
        }
    }
}

// 提交
function submitPickup() {
    var qty = parseInt(document.getElementById('claimQtyInput').value) || 0;
    if (qty <= 0) {
        alert('请至少提取1份');
        return;
    }
    alert('提货成功！您已提交 ' + qty + ' 份的提取申请。');
}

// 初始化
onQtyChange();
</script>
</body>
</html>
