<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html {
            background: #b0b8c6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: #f5f6fa;
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 100px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.04);
        }

        /* ===== 顶部：粉白渐变区 ===== */
        .top-section {
            background: linear-gradient(180deg, #f8d4d8 0%, #fce5e8 40%, #f5f6fa 100%);
            padding: 20px 20px 0;
        }

        /* ===== Header 用户信息 ===== */
        .user-header {
            display: flex;
            align-items: center;
            padding: 10px 0 22px;
        }
        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c4a883 0%, #8b6f47 100%);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .user-info {
            flex: 1;
            margin-left: 14px;
            min-width: 0;
        }
        .user-name {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .user-address {
            font-size: 12px;
            color: #6b7588;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-address .addr-text {
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-address .copy-icon {
            color: #4f7cff;
            font-size: 14px;
        }
        .user-id {
            font-size: 12px;
            color: #6b7588;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-id .id-text {
            color: #4f7cff;
            font-weight: 500;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-id .copy-icon {
            color: #4f7cff;
            font-size: 14px;
        }
        .user-login {
            font-size: 11px;
            color: #9ba6b9;
            margin-top: 4px;
        }
        .user-arrow {
            color: #c0c8d4;
            font-size: 18px;
        }

        /* ===== 统计区（无背景） ===== */
        .stats-row {
            display: flex;
            padding: 0 0 22px;
        }
        .stat-item {
            flex: 1;
            text-align: center;
            position: relative;
        }
        .stat-item + .stat-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 22%;
            height: 56%;
            width: 1px;
            background: rgba(0,0,0,0.08);
        }
        .stat-num {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .stat-label {
            font-size: 13px;
            color: #6b7588;
            margin-top: 4px;
        }

        /* ===== 账户余额（红色渐变） ===== */
        .balance-card {
            background: linear-gradient(135deg, #c45454 0%, #b04545 100%);
            border-radius: 14px;
            margin: 0 0 12px;
            padding: 16px 18px;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(176,69,69,0.15);
        }
        .balance-card::after {
            content: '';
            position: absolute;
            right: -20px;
            bottom: -30px;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }
        .balance-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }
        .balance-title {
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .eye-icon {
            font-size: 14px;
            opacity: 0.9;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: 600;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }
        .balance-btn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            z-index: 1;
        }

        /* ===== 订单卡片（独立白卡，内嵌四格） ===== */
        .order-card {
            background: #fff;
            border-radius: 12px;
            margin: 0 16px 12px;
            padding: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 10px;
        }
        .order-item {
            border-radius: 10px;
            padding: 12px 14px;
            position: relative;
            min-height: 76px;
            cursor: pointer;
        }
        .order-item.bg-orange {
            background: linear-gradient(135deg, #fff5e8 0%, #ffe9d0 100%);
        }
        .order-item.bg-blue {
            background: linear-gradient(135deg, #eef2ff 0%, #dde6ff 100%);
        }
        .order-item.bg-pink {
            background: linear-gradient(135deg, #ffe5e0 0%, #ffd6cf 100%);
        }
        .order-item .order-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .order-item .order-sub {
            font-size: 11px;
            color: #9ba6b9;
            margin-top: 2px;
        }
        .order-icon {
            position: absolute;
            right: 12px;
            bottom: 10px;
            font-size: 24px;
        }
        .order-item.bg-orange .order-icon { color: #f5a623; }
        .order-item.bg-blue .order-icon { color: #4f7cff; }
        .order-item.bg-pink .order-icon { color: #ff7e6e; }
        .order-item.span-2row {
            grid-row: span 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .order-item.span-2row .order-bottom {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
        }

        /* ===== 通用白色卡片（短入口 + 服务） ===== */
        .section-card {
            background: #fff;
            border-radius: 12px;
            margin: 0 16px 12px;
            padding: 18px 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }
        .grid-4 .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .grid-4 .grid-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .grid-4 .grid-label {
            font-size: 12px;
            color: #1a1a2e;
        }

        /* 第一行短入口：实心彩色图标 */
        .shortcut-card .grid-4 .grid-icon {
            color: #fff;
        }
        .shortcut-card .grid-4 .grid-item:nth-child(1) .grid-icon { color: #ff5e3a; }
        .shortcut-card .grid-4 .grid-item:nth-child(2) .grid-icon { color: #ffa726; }
        .shortcut-card .grid-4 .grid-item:nth-child(3) .grid-icon { color: #5c6bc0; }
        .shortcut-card .grid-4 .grid-item:nth-child(4) .grid-icon { color: #4f7cff; }

        /* 服务卡片：行间距更大 */
        .service-card .grid-4 {
            row-gap: 22px;
        }
        .service-card .grid-4 .grid-icon {
            width: 32px;
            height: 32px;
            font-size: 20px;
            color: #4f7cff;
        }
        .service-card .grid-4 .grid-item:nth-child(3) .grid-icon { color: #1a1a2e; }
        .service-card .grid-4 .grid-item:nth-child(4) .grid-icon { color: #1a1a2e; }

        /* ===== TabBar ===== */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            padding: 8px 0 12px;
            z-index: 10;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            color: #6b7588;
            cursor: pointer;
        }
        .tab-item.active { color: #e74c5e; }
        .tab-icon { font-size: 22px; line-height: 1; }

        /* 标注圆点 */
        .badge {
            display: inline-block;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 50%;
            background: #ff2d55;
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            font-weight: 600;
            box-shadow: 0 1px 3px rgba(255,45,85,0.3);
        }
        .badge.sm {
            min-width: 16px;
            height: 16px;
            font-size: 11px;
            line-height: 16px;
        }

        /* ── 功能说明浮窗 ── */
        .f-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 430px; max-width: 94vw; max-height: 80vh; overflow-y: auto; background: #fff; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,.2); z-index: 99999; padding: 22px; display: none; }
        .f-modal.show { display: block; }
        .f-modal .fm-title { font-size: 15px; font-weight: 600; color: #1a1a2e; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; cursor: grab; }
        .f-modal .fm-title:active { cursor: grabbing; }
        .f-modal .fm-close { width: 26px; height: 26px; border-radius: 50%; background: #f5f5f5; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: #666; border: none; flex-shrink: 0; }
        .f-modal .fm-close:hover { background: #e8e8e8; }
        .f-modal .fm-body { font-size: 13px; color: #555; line-height: 1.8; }
        .f-modal .fm-body h4 { font-size: 14px; font-weight: 600; color: #1a1a2e; margin: 14px 0 6px; }
        .f-modal .fm-body ul { padding-left: 18px; margin: 0 0 8px; }
        .f-modal .fm-body li { margin-bottom: 4px; }
    </style>
</head>
<body>

<!-- 顶部粉白渐变区（Header + 统计 + 账户余额） -->
<div class="top-section">

    <!-- 用户信息 -->
    <div class="user-header">

        <div class="user-info">

        </div>
        <div class="stat-item">

    <!-- 我的钱包 -->

</div>

<!-- 订单卡片：批发订单占左两行，我的买单/卖单占右两行 -->

    <div class="order-item bg-orange span-2row">

    </div>
    <div class="order-item bg-blue">
        <div class="order-title">我的买单</div>
        <div class="order-sub">共享超市购买的产品</div>
        <span class="order-icon">⬇</span>
    </div>
    <div class="order-item bg-pink">
        <div class="order-title">我的卖单</div>
        <div class="order-sub">共享超市出售的产品</div>
        <span class="order-icon">⬆</span>

</div>

<!-- 第一行短入口：4个彩色图标 -->
<div class="section-card shortcut-card">
    <div class="grid-4">
        <div class="grid-item">
            <div class="grid-icon">📋</div>
            <div class="grid-label">任务中心</div>
        </div>
        <div class="grid-item">
            <div class="grid-icon">👥</div>
            <div class="grid-label">我的队伍</div>
        </div>
        <div class="grid-item">
            <div class="grid-icon">💎</div>

        <div class="grid-item">

    </div>
</div>

<!-- 服务卡片：6个细线图标 -->
<div class="section-card service-card">
    <div class="grid-4">
        <div class="grid-item">
            <div class="grid-icon">🛡</div>
            <div class="grid-label">我的认证<span class="badge sm" style="margin-left:4px;">2</span></div>
        </div>
        <div class="grid-item">
            <div class="grid-icon">📋</div>
            <div class="grid-label">风险评测</div>
        </div>
        <div class="grid-item">
            <div class="grid-icon">🛡</div>
            <div class="grid-label">价值发现</div>
        </div>
        <div class="grid-item">
            <div class="grid-icon">🎧</div>
            <div class="grid-label">联系我们</div>
        </div>
        <div class="grid-item">

            <div class="grid-label">设置</div>
        </div>

</div>

<!-- TabBar -->
<div class="tabbar">
    <div class="tab-item">
        <div class="tab-icon">🏪</div>
        <div>批发市场</div>
    </div>
    <div class="tab-item">
        <div class="tab-icon">🛒</div>
        <div>共享超市</div>
    </div>
    <div class="tab-item active">
        <div class="tab-icon">👤</div>
        <div>我的</div>

</div>

<script>
function copyText(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand('copy');
        alert('已复制：' + text);
    } catch (e) {
        alert('复制失败，请手动复制');
    }
    document.body.removeChild(ta);
}
</script>

<!-- 浮动说明按钮（手机框外） -->
<button onclick="toggleFuncModal()" style="position:fixed;top:12px;right:16px;z-index:99999;background:#fff;color:#666;padding:7px 16px;border-radius:20px;border:1px solid #ddd;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08);font-family:inherit;display:inline-flex;align-items:center;gap:4px;">📖 说明</button>

<!-- ====== 功能说明浮窗 ====== -->
<div class="f-modal" id="funcModal">
  <div class="fm-title">
    <span>📖 功能说明</span>
    <button class="fm-close" onclick="toggleFuncModal()">✕</button>
  </div>
  <div class="fm-body">
    <h4><span class="badge">1</span> <span style="vertical-align:middle;">我的钱包</span></h4>
    <ul>
      <li>去掉原账户信息展示，替换成「我的钱包」入口</li>
    </ul>

    <ul>
      <li>去掉原「我的银行卡」功能</li>
    </ul>
  </div>
</div>

<script>
function toggleFuncModal() {
  var el = document.getElementById('funcModal');
  el.classList.toggle('show');
  if (el.classList.contains('show') && !el.dataset.dragged) {
    el.style.left = '50%'; el.style.top = '50%'; el.style.transform = 'translate(-50%,-50%)';
  }
}
(function() {
  var modal, titleBar, offX, offY, dragging = false;
  document.addEventListener('DOMContentLoaded', function() {
    modal = document.getElementById('funcModal');
    titleBar = modal.querySelector('.fm-title');
    titleBar.addEventListener('mousedown', startDrag);
    titleBar.addEventListener('touchstart', startDragTouch, {passive:true});
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchmove', onDragTouch, {passive:true});
    document.addEventListener('touchend', endDrag);
  });
  function startDrag(e) { if (e.target && e.target.classList && e.target.classList.contains('fm-close')) return; modal.dataset.dragged = '1'; modal.style.transform = ''; var rect = modal.getBoundingClientRect(); offX = e.clientX - rect.left; offY = e.clientY - rect.top; dragging = true; titleBar.style.cursor = 'grabbing'; }
  function startDragTouch(e) { if (e.target && e.target.classList && e.target.classList.contains('fm-close')) return; var t = e.touches[0]; modal.dataset.dragged = '1'; modal.style.transform = ''; var rect = modal.getBoundingClientRect(); offX = t.clientX - rect.left; offY = t.clientY - rect.top; dragging = true; }
  function onDrag(e) { if (!dragging) return; modal.style.left = (e.clientX - offX) + 'px'; modal.style.top = (e.clientY - offY) + 'px'; }
  function onDragTouch(e) { if (!dragging) return; var t = e.touches[0]; modal.style.left = (t.clientX - offX) + 'px'; modal.style.top = (t.clientY - offY) + 'px'; }
  function endDrag() { dragging = false; if (titleBar) titleBar.style.cursor = 'grab'; }
})();
</script>

</body>
