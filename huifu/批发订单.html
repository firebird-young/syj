<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批发订单 - APP 原型</title>
    <!-- ① 左侧目录：公用文件引用（菜单在 asset/admin-sidebar.js 的 MENU 中维护） -->
    <link rel="stylesheet" href="asset/admin-sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===== 主色（沿用本模块移动端红粉调性，全页与右侧说明面板共用变量） ===== */
        :root {
            --accent: #e74c5e;
            --accent-dark: #c45454;
            --ink: #1a1a2e;
            --ink-sub: #4e5a6e;
            --ink-weak: #86909c;
            --line: #f0f0f0;
            --card-radius: 14px;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: #f5f5f7;
            color: var(--ink);
            font-size: 14px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== ② 中间原型内容（面包屑 + 手机原型） ===== */
        .breadcrumb {
            padding: 16px 24px 0; font-size: 13px; color: var(--ink-weak);
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .breadcrumb a { color: var(--ink-weak); text-decoration: none; }
        .breadcrumb a:hover { color: var(--accent); }
        .breadcrumb .sep { margin: 0 4px; }
        .breadcrumb .current { color: var(--ink); font-weight: 500; }

        /* 面包屑右侧：状态筛选（与列表 Tab 联动） */
        .bc-switch { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .bc-switch-label { font-size: 12px; color: var(--ink-weak); }
        .bc-switch-btn {
            height: 26px; padding: 0 12px; border-radius: 9999px; cursor: pointer;
            border: 1px solid var(--border); background: #fff;
            font-size: 12px; color: var(--ink-sub); font-family: inherit;
            transition: all .2s;
        }
        .bc-switch-btn:hover { border-color: var(--accent); color: var(--accent); }
        .bc-switch-btn.active {
            background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
        }

        .main {
            padding: 16px 24px 40px;
            display: flex; justify-content: center; align-items: flex-start;
        }

        /* 手机页面容器：固定屏高 + 内部滚动（430px） */
        .app-container {
            width: 100%; max-width: 430px; flex-shrink: 0;
            height: calc(100vh - 120px);
            background: #f5f5f5; border-radius: 18px; overflow: hidden;
            box-shadow: 0 10px 34px rgba(30, 60, 120, 0.14);
            display: flex; flex-direction: column;
            position: relative;
        }
        .app-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .app-scroll::-webkit-scrollbar { width: 4px; }
        .app-scroll::-webkit-scrollbar-thumb { background: #d8dce3; border-radius: 2px; }

        /* 顶部三段：状态栏 + 标题栏 + 状态 Tab（整体吸顶） */
        .page-top { position: sticky; top: 0; z-index: 80; }
        .status-bar {
            height: 44px; background: #fff; color: var(--ink);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
        }
        .status-bar .sb-left { display: flex; align-items: baseline; gap: 8px; }
        .status-bar .sb-time { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
        .status-bar .sb-date { font-size: 12px; color: #666; }
        .status-bar .sb-right { display: flex; align-items: center; gap: 7px; }
        .status-bar .sb-signal { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 11px; }
        .status-bar .sb-signal i { width: 3px; border-radius: 1px; background: currentColor; }
        .status-bar .sb-signal i:nth-child(1) { height: 4px; }
        .status-bar .sb-signal i:nth-child(2) { height: 6px; }
        .status-bar .sb-signal i:nth-child(3) { height: 8px; }
        .status-bar .sb-signal i:nth-child(4) { height: 11px; }
        .status-bar .sb-wifi { width: 15px; height: 11px; position: relative; display: inline-block; }
        .status-bar .sb-wifi::before {
            content: ''; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
            width: 5px; height: 5px; border-radius: 50%; background: currentColor;
        }
        .status-bar .sb-wifi::after {
            content: ''; position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
            width: 14px; height: 14px; box-sizing: border-box;
            border-top: 2px solid currentColor; border-radius: 50%;
        }
        .status-bar .sb-batt {
            width: 25px; height: 12px; border: 1.4px solid currentColor;
            border-radius: 3px; padding: 1.5px; position: relative;
        }
        .status-bar .sb-batt::after {
            content: ''; position: absolute; right: -3.5px; top: 50%; transform: translateY(-50%);
            width: 2px; height: 5px; background: currentColor; border-radius: 0 1px 1px 0;
        }
        .status-bar .sb-batt i { display: block; height: 100%; width: 78%; background: currentColor; border-radius: 1px; }

        .top-nav {
            height: 50px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex; align-items: center; padding: 0 16px;
        }
        .top-nav .back-btn {
            width: 32px; font-size: 24px; color: #fff; line-height: 1;
            cursor: pointer; text-align: left;
        }
        .top-nav .top-nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: #fff; }
        .top-nav .right-placeholder { width: 32px; }

        /* 状态 Tab */
        .status-tabs {
            background: #fff; display: flex; padding: 0 16px;
            border-bottom: 1px solid var(--line);
        }
        .status-tab {
            flex: 1; height: 44px; background: transparent; border: none;
            font-size: 14px; color: var(--ink-sub); cursor: pointer;
            position: relative; font-weight: 500; font-family: inherit;
        }
        .status-tab.active { color: var(--ink); font-weight: 600; }
        .status-tab.active::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 24px; height: 3px; background: var(--accent); border-radius: 2px;
        }

        /* 订单列表 */
        .order-list { padding: 12px 16px 16px; }
        .order-card {
            background: #fff; border-radius: var(--card-radius);
            margin-bottom: 12px; padding: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
            position: relative; cursor: pointer;
        }
        .order-card:active { background: #fcfcfd; }
        .order-card-top { display: flex; align-items: center; gap: 12px; }
        .order-img {
            width: 64px; height: 64px; border-radius: 8px; flex-shrink: 0;
            background: linear-gradient(135deg, #d4a574, #8b6f47);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #fff; overflow: hidden;
        }
        .order-img.letter { background: #f5f0e1; color: #8b6f47; font-family: serif; font-size: 18px; }
        .order-img.lamp { background: linear-gradient(135deg, #d4af37, #8b6914); }
        .order-img.bottle { background: linear-gradient(135deg, #f0e68c, #b8860b); }
        .order-info { flex: 1; min-width: 0; }
        .order-name { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 2px; }
        .order-code { font-size: 12px; color: var(--ink-sub); }
        .order-date { font-size: 11px; color: var(--ink-weak); margin-top: 4px; }
        .order-price { text-align: right; flex-shrink: 0; }
        .order-price .price { font-size: 16px; font-weight: 600; color: var(--accent); }
        .order-price .qty { font-size: 12px; color: var(--ink-sub); margin-top: 2px; }

        /* 状态标签 */
        .order-status {
            font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500;
            flex-shrink: 0; align-self: flex-start; display: inline-block; margin-top: 6px;
        }
        .order-status.pending { background: #fff0e0; color: #e67e22; }
        .order-status.done { background: #e8f5e9; color: #34a853; }
        .order-status.canceled { background: #f5f5f5; color: var(--ink-weak); }

        /* 操作按钮 */
        .order-actions {
            display: flex; justify-content: flex-end; gap: 8px;
            margin-top: 10px; padding-top: 10px; border-top: 1px solid #f5f5f7;
        }
        .order-actions .action-btn {
            height: 30px; padding: 0 14px; border-radius: 6px;
            border: 1px solid #d0d5dd; background: #fff;
            font-size: 12px; color: var(--ink-sub); cursor: pointer; font-family: inherit;
        }
        .order-actions .action-btn:active { background: #f5f5f7; }
        .order-actions .action-btn.primary {
            background: var(--accent); color: #fff; border-color: var(--accent);
        }
        .order-actions .action-btn.primary:active { background: var(--accent-dark); }

        /* 空状态 */
        .empty { text-align: center; padding: 60px 20px; color: var(--ink-weak); font-size: 14px; }

        /* 标注圆点 */
        .badge {
            display: inline-block; min-width: 18px; height: 18px; padding: 0 5px;
            border-radius: 50%; background: #ff2d55; color: #fff; font-size: 12px;
            line-height: 18px; text-align: center; font-weight: 600;
            box-shadow: 0 1px 3px rgba(255,45,85,0.3);
        }
        .badge.sm { min-width: 16px; height: 16px; font-size: 11px; line-height: 16px; }

        /* 轻提示（z-index 高于目录栏 900 / 说明面板 890） */
        .toast {
            position: fixed; top: 70px; left: 50%;
            transform: translateX(-50%) translateY(-14px);
            background: rgba(26,26,46,.92); color: #fff; padding: 9px 20px;
            border-radius: 9999px; font-size: 13px; max-width: 70vw;
            opacity: 0; pointer-events: none; transition: all .25s; z-index: 9999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== ③ 右侧功能说明面板（配色复用页面变量） ===== */
        .func-panel {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 340px; z-index: 890;
            background: #fff; border-left: 1px solid #e3e6eb;
            box-shadow: -1px 0 12px rgba(20, 30, 60, 0.04);
            display: flex; flex-direction: column;
        }
        .func-panel .fp-inner { display: flex; flex-direction: column; height: 100%; min-width: 0; }
        .func-panel .fp-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 14px 13px 18px; border-bottom: 1px solid #f0f1f4; flex-shrink: 0;
        }
        .func-panel .fp-title { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; color: var(--ink); }
        .func-panel .fp-title::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 0 4px rgba(231, 76, 94, 0.14);
        }
        .func-panel .fp-fold-btn {
            width: 28px; height: 28px; border: 1px solid var(--border); background: #fff;
            border-radius: 50%; color: var(--ink-weak); font-size: 15px; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .func-panel .fp-fold-btn:hover { border-color: var(--accent); color: var(--accent); }
        .func-panel .fp-body { flex: 1; overflow-y: auto; padding: 4px 18px 40px; font-size: 13px; color: #555; line-height: 1.9; }
        .func-panel .fp-body::-webkit-scrollbar { width: 5px; }
        .func-panel .fp-body::-webkit-scrollbar-thumb { background: #d8dce3; border-radius: 3px; }
        .func-panel .fp-body h4 { font-size: 14px; font-weight: 600; color: var(--ink); margin: 18px 0 6px; }
        .func-panel .fp-body h4:first-child { margin-top: 12px; }
        .func-panel .fp-body ul { padding-left: 18px; margin: 0 0 8px; }
        .func-panel .fp-body li { margin-bottom: 6px; }
        .func-panel .fp-body strong { color: #333; }
        .func-panel .fp-body .badge { vertical-align: 1px; }
        .func-panel .fp-open {
            display: none; position: absolute; top: 0; bottom: 0; left: 0; right: 0;
            border: none; background: transparent; cursor: pointer;
            writing-mode: vertical-rl; text-orientation: upright;
            font-size: 13px; font-weight: 600; letter-spacing: 6px; color: var(--ink-weak);
            align-items: center; justify-content: center; font-family: inherit; transition: all 0.2s;
        }
        .func-panel .fp-open:hover { color: var(--accent); background: #fafbfc; }

        @media (min-width: 1024px) {
            .main, .breadcrumb { margin-right: 340px; }
            body.fp-collapsed .main,
            body.fp-collapsed .breadcrumb { margin-right: 40px; }
            body.fp-collapsed .func-panel { width: 40px; }
            body.fp-collapsed .fp-inner { display: none; }
            body.fp-collapsed .fp-open { display: flex; }
        }
        @media (max-width: 1023.98px) {
            .func-panel { display: none; }
            .main, .breadcrumb { margin-right: 0; }
        }
        /* 真机宽度：手机页铺满 */
        @media (max-width: 540px) {
            .main { padding: 12px 0 32px; }
            .breadcrumb { padding: 12px 16px 0; }
            .app-container { border-radius: 0; box-shadow: none; height: 100vh; }
        }
    </style>
</head>
<body>

<!-- ① 中间原型内容：面包屑 + 手机页面 -->
<div class="breadcrumb">
    <span>
        <a href="index.html">首页</a>
        <span class="sep">&gt;</span>
        <span>APP 端</span>
        <span class="sep">&gt;</span>
        <span class="current">批发订单</span>
    </span>
    <span class="bc-switch">
        <span class="bc-switch-label">筛选状态</span>
        <button class="bc-switch-btn active" data-status="all" onclick="setStatus('all', this)">全部</button>
        <button class="bc-switch-btn" data-status="pending" onclick="setStatus('pending', this)">待支付</button>
        <button class="bc-switch-btn" data-status="done" onclick="setStatus('done', this)">已成交</button>
        <button class="bc-switch-btn" data-status="canceled" onclick="setStatus('canceled', this)">已取消</button>
    </span>
</div>

<div class="main">
    <div class="app-container">

        <div class="app-scroll">

            <!-- 顶部：状态栏 + 标题栏 + 状态 Tab -->
            <header class="page-top">
                <div class="status-bar">
                    <span class="sb-left">
                        <span class="sb-time">9:41</span>
                        <span class="sb-date">9月22日 星期二</span>
                    </span>
                    <span class="sb-right">
                        <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
                        <span class="sb-wifi"></span>
                        <span class="sb-batt"><i></i></span>
                    </span>
                </div>
                <div class="top-nav">
                    <span class="back-btn" onclick="goBack()">‹</span>
                    <span class="top-nav-title">批发订单</span>
                    <span class="right-placeholder"></span>
                </div>
                <div class="status-tabs">
                    <button class="status-tab active" data-status="all" onclick="selectTab(this)">全部</button>
                    <button class="status-tab" data-status="pending" onclick="selectTab(this)">待支付</button>
                    <button class="status-tab" data-status="done" onclick="selectTab(this)">已成交</button>
                    <button class="status-tab" data-status="canceled" onclick="selectTab(this)">已取消</button>
                </div>
            </header>

            <!-- 订单列表 -->
            <div class="order-list" id="orderList"></div>

        </div>

    </div>
</div>

<!-- ③ 右侧功能说明面板 -->
<aside class="func-panel">
    <div class="fp-inner">
        <div class="fp-header">
            <span class="fp-title">功能说明</span>
            <button class="fp-fold-btn" onclick="toggleFuncPanel()" title="收起功能说明">›</button>
        </div>
        <div class="fp-body">

            <h4>1、待支付 <span class="badge">1</span></h4>
            <ul>
                <li>增加<strong>待支付</strong>状态的订单</li>
                <li>待支付订单支持<strong>去支付</strong>、<strong>取消</strong>操作</li>
            </ul>

            <h4>2、已取消 <span class="badge">2</span></h4>
            <ul>
                <li>增加<strong>已取消</strong>状态的订单</li>
                <li>支持查看已取消的订单记录</li>
            </ul>

            <h4>3、原型说明</h4>
            <ul>
                <li>顶部状态栏、标题栏为移动端公用骨架，返回按钮回上一页</li>
                <li>「全部 / 待支付 / 已成交 / 已取消」为状态筛选 Tab，随页面滚动吸顶</li>
                <li>面包屑右侧<strong>「筛选状态」</strong>与列表 Tab 联动，用于手机框外快速切换视图</li>
                <li>点击订单卡片进入<strong>批发订单详情</strong></li>
            </ul>

        </div>
    </div>
    <button class="fp-open" onclick="toggleFuncPanel()" title="展开功能说明">功能说明‹</button>
</aside>

<div class="toast" id="toast"></div>

<!-- ② 左侧目录：公用文件引用 -->
<script src="asset/admin-sidebar.js"></script>

<script>
/* ── 右侧功能说明面板：收起 / 展开 ── */
function toggleFuncPanel() {
    document.body.classList.toggle('fp-collapsed');
}

/* ── 轻提示 ── */
var toastTimer;
function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
}

function goBack() {
    if (history.length > 1) { history.back(); } else { location.href = 'index.html'; }
}

/* ── 订单数据与渲染 ── */
var orders = [
    { name: '永淳·夏日帖', code: 'XB000004', price: 128.00, qty: 1, date: '2025-10-15 11:57:08', status: 'pending', img: 'letter' },
    { name: '永淳·夏日帖', code: 'XB000004', price: 128.00, qty: 1, date: '2025-10-15 10:11:43', status: 'pending', img: 'letter' },
    { name: '永淳·夏日帖', code: 'XB000004', price: 128.00, qty: 1, date: '2025-10-14 14:01:30', status: 'pending', img: 'letter' },
    { name: '仙鹤莲池', code: 'XB000002', price: 366.00, qty: 1, date: '2025-03-26 09:59:41', status: 'done', img: 'lamp' },
    { name: '山水空灵', code: 'XB000001', price: 218.00, qty: 1, date: '2025-01-06 11:27:45', status: 'done', img: 'bottle' },
    { name: '东坡东坡-测试数据', code: 'TS000006', price: 90.24, qty: 48, date: '2024-12-30 11:22:28', status: 'canceled', img: '' }
];

var currentStatus = 'all';
var statusNames = { pending: '待支付', done: '已成交', canceled: '已取消' };

function renderList() {
    var list = document.getElementById('orderList');
    var filtered = currentStatus === 'all' ? orders : orders.filter(function (o) { return o.status === currentStatus; });

    if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">暂无订单</div>';
        return;
    }

    var html = '';
    filtered.forEach(function (o) {
        var actionsHtml = '';
        if (o.status === 'pending') {
            actionsHtml = '<div class="order-actions">' +
                '<button class="action-btn" onclick="event.stopPropagation();cancelOrder(\'' + o.code + '\')">取消</button>' +
                '<button class="action-btn primary" onclick="event.stopPropagation();payOrder(\'' + o.code + '\')">去支付</button>' +
                '</div>';
        }

        html += [
            '<div class="order-card" onclick="location.href=\'批发订单详情.html\'">',
            '    <div class="order-card-top">',
            '        <div class="order-img ' + o.img + '">' + (o.img ? '' : '🏺') + '</div>',
            '        <div class="order-info">',
            '            <div class="order-name">' + o.name + '</div>',
            '            <div class="order-code">' + o.code + '</div>',
            '            <div class="order-date">' + o.date + '</div>',
            '        </div>',
            '        <div class="order-price">',
            '            <div class="price">¥' + o.price.toFixed(2) + '</div>',
            '            <div class="qty">X' + o.qty + '</div>',
            '            <div class="order-status ' + o.status + '">' + statusNames[o.status] + '</div>',
            '        </div>',
            '    </div>',
            actionsHtml,
            '</div>'
        ].join('');
    });
    list.innerHTML = html;
}

/* ── 状态筛选：列表 Tab 与面包屑按钮联动 ── */
function syncStatus(status) {
    currentStatus = status;
    document.querySelectorAll('.status-tab').forEach(function (t) {
        t.classList.toggle('active', t.dataset.status === status);
    });
    document.querySelectorAll('.bc-switch-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.status === status);
    });
    renderList();
}

function selectTab(btn) { syncStatus(btn.dataset.status); }
function setStatus(status) { syncStatus(status); }

/* ── 订单操作 ── */
function payOrder(code) { location.href = '批发市场支付.html'; }
function cancelOrder(code) { showToast('取消订单：' + code + '（演示）'); }

renderList();
</script>

</body>
</html>
