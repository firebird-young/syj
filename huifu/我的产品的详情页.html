<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>持有详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            font-size: 14px;
            min-height: 100vh;
        }
        .app-container {
            max-width: 430px;
            margin: 0 auto;
            background: #f5f5f5;
            min-height: 100vh;
            position: relative;
            padding-bottom: 40px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.06);
        }

        /* 顶部 */
        .header {
            background: #fff;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #f0f0f0;
        }
        .header .back {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            color: #1a1a2e;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }
        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
        }

        /* 产品信息卡 */
        .product-info {
            background: #fff;
            margin: 10px 12px 0;
            padding: 16px 14px 14px;
            border-radius: 10px;
        }
        .pi-name {
            font-size: 17px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .pi-code {
            display: inline-block;
            font-size: 11px;
            color: #1a78ff;
            font-weight: 600;
            background: #e6f4ff;
            border: 1px solid #b7dcff;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* 数量卡 */
        .hold-card {
            background: #f0f0f3;
            margin: 10px 12px 0;
            padding: 14px;
            border-radius: 10px;
        }
        .hold-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .hold-label {
            font-size: 13px;
            color: #4e5a6e;
        }
        .hold-value {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
        }

        /* 列表 */
        .list-card {
            background: #fff;
            margin: 10px 12px 0;
            border-radius: 10px;
            overflow: hidden;
        }
        .list-head {
            display: flex;
            align-items: center;
            background: #f5f5f7;
            padding: 10px 14px;
            font-size: 13px;
            color: #4e5a6e;
            font-weight: 500;
        }
        .list-head .col-no { width: 80px; }
        .list-head .col-cert { flex: 1; text-align: center; }
        .list-head .col-op { width: 78px; text-align: right; }

        .list-row {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid #f5f5f7;
            font-size: 13px;
            color: #1a1a2e;
        }
        .list-row:last-child { border-bottom: none; }
        .list-row .col-no { width: 80px; }
        .list-row .col-cert {
            flex: 1;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 12px;
            color: #4e5a6e;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 6px;
        }
        .cert-btn {
            flex-shrink: 0;
            color: #e74c5e;
            background: #fff;
            border: 1px solid #e74c5e;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            margin-left: 8px;
        }
        .cert-btn:active { background: #fdecee; }

        /* ── 功能说明面板（手机框右侧） ── */
        .page-wrap { display: flex; justify-content: center; align-items: flex-start; gap: 24px; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .page-wrap .app-container { margin: 0; }
        .doc-panel { width: 560px; background: #fff; border-radius: 16px; box-shadow: 0 2px 20px rgba(0,0,0,.08); padding: 24px 28px; max-height: calc(100vh - 40px); overflow-y: auto; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', Arial, sans-serif; line-height: 1.7; font-size: 14px; color: #333; }
        .doc-panel::-webkit-scrollbar { width: 5px; }
        .doc-panel::-webkit-scrollbar-thumb { background: #d0d5e0; border-radius: 3px; }
        .doc-panel .doc-title { font-size: 20px; font-weight: 700; color: #1F3864; border-bottom: 2px solid #2E75B6; padding-bottom: 10px; margin-bottom: 16px; }
        .doc-panel h3 { font-size: 16px; font-weight: 600; color: #2E75B6; margin: 16px 0 8px; }
        .doc-panel p { font-size: 13px; color: #555; margin-bottom: 6px; }
        .doc-panel ul { padding-left: 20px; margin: 4px 0 8px; }
        .doc-panel li { margin-bottom: 3px; font-size: 13px; color: #555; }
        @media (max-width: 1100px) { .page-wrap { flex-direction: column; align-items: center; } .doc-panel { width: 100%; max-width: 430px; max-height: none; } }
    </style>
</head>
<body>
