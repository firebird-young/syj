<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资产</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            font-size: 14px;
        }

        .topbar {
            background: #fff;
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .menu-btn {
            width: 32px; height: 32px;
            border: 1px solid #d0d5dd;
            border-radius: 4px;
            background: #fff;
            color: #6b7588;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .menu-btn:hover { background: #f5f5f7; }
        .breadcrumb { font-size: 13px; color: #6b7588; }
        .breadcrumb .active { color: #1a1a2e; }
        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .topbar-right .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #f5deb3;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .topbar-right .name { font-size: 13px; }
        .topbar-right .arrow { color: #9ba6b9; font-size: 12px; }

        .container { padding: 16px; }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 16px;
        }

        /* 资金汇总卡片 */
        .summary-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .summary-card {
            flex: 1;
            background: #fff;
            border-radius: 6px;
            padding: 16px 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .summary-card .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .summary-card .label {
            font-size: 14px;
            color: #4e5a6e;
            font-weight: 500;
        }
        .summary-card .amount {
            font-size: 22px;
            font-weight: 700;
        }
        .summary-card .amount.bff { color: #e67e22; }
        .summary-card .amount.hf { color: #4f7cff; }
        .summary-card .btn {
            background: #1a78ff;
            color: #fff;
            border: none;
            padding: 5px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        .summary-card .btn:hover { background: #0f6ae8; }

        /* Tab */
        .tabs {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            padding: 0 16px;
        }
        .tab {
            padding: 14px 16px;
            font-size: 14px;
            color: #6b7588;
            cursor: pointer;
            position: relative;
            font-weight: 500;
        }
        .tab.active {
            color: #1a1a2e;
            font-weight: 600;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: #1a78ff;
            border-radius: 2px;
        }

        .table-card {
            background: #fff;
            border-radius: 0;
            overflow: hidden;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th {
            background: #fafbfc;
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            color: #4e5a6e;
            font-weight: 500;
            border-bottom: 1px solid #f0f0f0;
        }
        .table td {
            padding: 14px 16px;
            font-size: 13px;
            color: #1a1a2e;
            border-bottom: 1px solid #f5f5f7;
        }
        .table tr:last-child td { border-bottom: none; }
        .col-sort {
            display: inline-block;
            margin-left: 4px;
            color: #c0c8d4;
            cursor: pointer;
        }
        .amount-pos { color: #4caf50; font-weight: 500; }
        .amount-neg { color: #D62828; font-weight: 500; }

        .pagination {
            background: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            font-size: 13px;
            color: #4e5a6e;
            border-top: 1px solid #f5f5f7;
        }
        .pagination .total { margin-right: 16px; }
        .page-btn {
            min-width: 28px;
            height: 28px;
            padding: 0 8px;
            background: #fff;
            border: 1px solid #d0d5dd;
            border-radius: 4px;
            font-size: 13px;
            color: #4e5a6e;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .page-btn:hover { color: #1a78ff; border-color: #1a78ff; }
        .page-btn.active {
            background: #1a78ff;
            color: #fff;
            border-color: #1a78ff;
        }
        .page-jump {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 12px;
        }
        .page-jump input {
            width: 48px;
            height: 28px;
            border: 1px solid #d0d5dd;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            outline: none;
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <button class="menu-btn">≡</button>
        <div class="breadcrumb">
            <span>首页</span> /
            <span class="active">我的资产</span>
        </div>
    </div>
    <div class="topbar-right">
        <span class="avatar">👤</span>
        <span class="name">系统参数设置</span>
        <span class="arrow">▾</span>
    </div>
</div>

<div class="container">
    <div class="page-title">我的资产</div>

    <!-- 资金汇总卡片 -->
    <div class="summary-row">
        <div class="summary-card">
            <div class="head">
                <span class="label">宝付钱包余额</span>
                <button class="btn">提现</button>
            </div>
            <span class="amount bff">128.00</span>
        </div>
        <div class="summary-card">
            <div class="head">
                <span class="label">汇付钱包余额</span>
                <button class="btn">提现</button>
            </div>
            <span class="amount hf">3,286.50</span>
        </div>
    </div>

    <!-- Tab -->
    <div class="tabs">
        <div class="tab active" data-tab="income" onclick="selectTab(this)">收入明细</div>
        <div class="tab" data-tab="expense" onclick="selectTab(this)">支出明细</div>
    </div>

    <!-- 表格 -->
    <div class="table-card">
        <table class="table" id="tableEl">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div class="pagination">
            <span class="total" id="totalText"></span>
            <button class="page-btn">‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">4</button>
            <button class="page-btn">5</button>
            <span style="color:#9ba6b9;">...</span>
            <button class="page-btn">9</button>
            <button class="page-btn">›</button>
            <div class="page-jump">前往 <input type="text" value="1"> 页</div>
        </div>
    </div>
</div>

<script>
var incomeData = [
    { product: '中路财童', stage: '零售市场', createTime: '2026-01-22 14:49:31', updateTime: '2026-01-22 14:49:31', amount: '+1157.79', channel: '宝付钱包' },
    { product: '榜样-统一', stage: '零售市场', createTime: '2026-01-22 16:54:45', updateTime: '2026-01-22 16:54:45', amount: '+1.95', channel: '汇付钱包' },
    { product: '青莲-舒展', stage: '零售市场', createTime: '2026-01-22 17:43:26', updateTime: '2026-01-22 17:43:26', amount: '+442.45', channel: '宝付钱包' },
    { product: '东坡-惜春', stage: '零售市场', createTime: '2026-01-23 10:44:30', updateTime: '2026-01-23 10:44:30', amount: '+4909.68', channel: '汇付钱包' },
    { product: '东坡-虚静', stage: '零售市场', createTime: '2026-01-26 15:06:58', updateTime: '2026-01-26 15:06:58', amount: '+2408.00', channel: '宝付钱包' },
    { product: '东坡-神气', stage: '零售市场', createTime: '2026-01-27 11:44:03', updateTime: '2026-01-27 11:44:03', amount: '+3.20', channel: '宝付钱包' },
    { product: '东坡-安心', stage: '零售市场', createTime: '2026-04-02 14:59:51', updateTime: '2026-04-02 14:59:51', amount: '+250.00', channel: '汇付钱包' },
    { product: '东坡-大顺', stage: '零售市场', createTime: '2026-04-03 15:09:41', updateTime: '2026-04-03 15:09:41', amount: '+2.30', channel: '宝付钱包' },
    { product: '东坡-万里', stage: '零售市场', createTime: '2026-04-08 16:04:00', updateTime: '2026-04-08 16:04:00', amount: '+2.41', channel: '汇付钱包' },
    { product: '东坡-君子', stage: '零售市场', createTime: '2026-05-25 14:45:12', updateTime: '2026-05-25 14:45:12', amount: '+15.50', channel: '宝付钱包' }
];

var expenseData = [
    { product: '提现', stage: '提现', createTime: '2026-07-20 14:30:00', updateTime: '2026-07-20 14:30:00', amount: '-500.00', channel: '宝付钱包' }
];

var currentTab = 'income';

function renderHead() {
    document.getElementById('tableHead').innerHTML = [
        '<tr>',
        '    <th>产品名称</th>',
        '    <th>阶段</th>',
        '    <th>创建时间 <span class="col-sort">⇅</span></th>',
        '    <th>修改时间 <span class="col-sort">⇅</span></th>',
        '    <th>支付渠道</th>',
        '    <th>收支（¥）</th>',
        '</tr>'
    ].join('');
}

function renderTable() {
    renderHead();
    var data = currentTab === 'income' ? incomeData : expenseData;
    var html = '';
    data.forEach(function(o) {
        var amountClass = o.amount.charAt(0) === '+' ? 'amount-pos' : 'amount-neg';
        html += [
            '<tr>',
            '    <td>' + o.product + '</td>',
            '    <td>' + o.stage + '</td>',
            '    <td>' + o.createTime + '</td>',
            '    <td>' + o.updateTime + '</td>',
            '    <td>' + o.channel + '</td>',
            '    <td class="' + amountClass + '">' + o.amount + '</td>',
            '</tr>'
        ].join('');
    });
    document.getElementById('tableBody').innerHTML = html;
    document.getElementById('totalText').textContent = '共 ' + data.length + ' 条';
}

function selectTab(el) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
    currentTab = el.dataset.tab;
    renderTable();
}

renderTable();
</script>

</body>
</html>
