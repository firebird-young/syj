<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卖单详情</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: #f2f3f5;
            color: #1a1a2e;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .app { max-width: 375px; margin: 0 auto; background: #f2f3f5; min-height: 100vh; }

        /* iOS 状态栏 */
        .status-bar {
            height: 44px; padding: 0 22px 0 24px;
            display: flex; align-items: center; justify-content: space-between;
            font-size: 15px; font-weight: 600;
            color: #1a1a2e;
        }
        .status-bar .right { display: flex; align-items: center; gap: 5px; }
        .status-bar svg { display: block; }
        .battery {
            display: inline-block; border: 1px solid #1a1a2e; border-radius: 3px;
            padding: 1px 3px; font-size: 11px; font-weight: 500;
            position: relative; line-height: 1;
        }
        .battery::after {
            content: ''; position: absolute; right: -3px; top: 50%;
            transform: translateY(-50%);
            width: 2px; height: 6px; background: #1a1a2e; border-radius: 0 1px 1px 0;
        }

        /* 顶部导航 */
        .nav {
            height: 44px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            background: #f2f3f5;
        }
        .nav .back {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .nav .title { font-size: 17px; font-weight: 600; color: #1a1a2e; }

        /* 卡片 */
        .card {
            background: #fff;
            margin: 8px 12px 16px;
            border-radius: 8px;
            padding: 16px;
        }
        /* 头部产品 */
        .prod-head { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; }
        .prod-img {
            width: 64px; height: 64px; border-radius: 4px;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.18) 100%),
                linear-gradient(135deg, #d4c4a8 0%, #b59b76 50%, #8b7355 100%);
            position: relative; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .prod-img::before {
            content: "永 淳";
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: "STKaiti", "KaiTi", "Songti SC", serif;
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            letter-spacing: 4px;
            line-height: 1.2;
        }
        .prod-img::after {
            content: "";
            position: absolute; right: 6px; top: 6px; bottom: 6px;
            border-right: 1px solid rgba(255,255,255,0.25);
        }
        .prod-info { flex: 1; min-width: 0; }
        .prod-name { font-size: 15px; font-weight: 600; color: #1a1a2e; margin-bottom: 6px; }
        .prod-id { font-size: 12px; color: #8a8f99; margin-bottom: 2px; }
        .prod-qty { font-size: 12px; color: #8a8f99; }
        .prod-right { text-align: right; flex-shrink: 0; }
        .status-pill {
            display: inline-block;
            background: #e8f5ec; color: #16a34a;
            font-size: 12px; padding: 2px 8px; border-radius: 4px;
            margin-bottom: 8px;
        }
        .prod-price { font-size: 17px; font-weight: 600; color: #1a1a2e; }

        /* 列表项 */
        .row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0;
            font-size: 14px;
        }
        .row .label { color: #8a8f99; flex-shrink: 0; }
        .row .value { color: #1a1a2e; text-align: right; max-width: 65%; word-break: break-all; }
        .row .value.price { font-weight: 600; }
        .row .value.link { color: #3b82f6; }
        .row + .row { border-top: 1px solid #f5f5f7; }
    </style>
</head>
<body>
<div class="app">

    <!-- iOS 状态栏 -->
    <div class="status-bar">
        <span>10:00</span>
        <div class="right">
            <svg width="16" height="11" viewBox="0 0 16 11">
                <rect x="0" y="7" width="3" height="4" fill="#1a1a2e" rx="0.5"/>
                <rect x="4.5" y="5" width="3" height="6" fill="#1a1a2e" rx="0.5"/>
                <rect x="9" y="2.5" width="3" height="8.5" fill="#1a1a2e" rx="0.5"/>
                <rect x="13.5" y="0" width="3" height="11" fill="#1a1a2e" rx="0.5"/>
            </svg>
            <svg width="16" height="11" viewBox="0 0 16 11">
                <path d="M8 1.5C5.4 1.5 3 2.7 1 4.6l1.4 1.4C4 4.5 5.9 3.5 8 3.5s4 1 5.6 2.5L15 4.6C13 2.7 10.6 1.5 8 1.5z" fill="#1a1a2e"/>
                <path d="M8 4.8c-1.7 0-3.3.6-4.5 1.7L5 8c.8-.7 1.9-1.2 3-1.2s2.2.5 3 1.2l1.5-1.5C11.3 5.4 9.7 4.8 8 4.8z" fill="#1a1a2e"/>
                <path d="M8 8.2c-.7 0-1.4.3-1.9.7L8 11l1.9-2.1c-.5-.4-1.2-.7-1.9-.7z" fill="#1a1a2e"/>
            </svg>
            <svg width="16" height="11" viewBox="0 0 16 11">
                <path d="M1 5.5C2.7 3.9 5.2 3 8 3s5.3.9 7 2.5l-1 1C12.5 5.1 10.3 4.3 8 4.3S3.5 5.1 2 6.5l-1-1z" fill="#1a1a2e"/>
            </svg>
            <span class="battery">29</span>
        </div>
    </div>

    <!-- 顶部导航 -->
    <div class="nav">
        <div class="back" onclick="history.back()">
            <svg width="11" height="18" viewBox="0 0 11 18" fill="none">
                <path d="M10 1L1 9l9 8" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="title">卖单详情</div>
    </div>

    <!-- 详情卡片 -->
    <div class="card">
        <!-- 头部产品信息 -->
        <div class="prod-head">
            <div class="prod-img"></div>
            <div class="prod-info">
                <div class="prod-name">永淳·夏日帖</div>
                <div class="prod-id">XB000004</div>
                <div class="prod-qty">x1</div>
            </div>
            <div class="prod-right">
                <div class="status-pill">已成交</div>
                <div class="prod-price">¥70.00</div>
            </div>
        </div>

        <!-- 详情字段 -->
        <div class="row">
            <div class="label">实际到手</div>
            <div class="value price">¥68.60</div>
        </div>
        <div class="row">
            <div class="label">成交数量</div>
            <div class="value">1</div>
        </div>
        <div class="row">
            <div class="label">平台抽成</div>
            <div class="value">¥1.40（2%）</div>
        </div>
        <div class="row">
            <div class="label">交易方</div>
            <div class="value">******2980</div>
        </div>
        <div class="row">
            <div class="label">创建时间</div>
            <div class="value">2025-11-14 10:31:01</div>
        </div>
        <div class="row">
            <div class="label">支付时间</div>
            <div class="value">2025-11-14 10:31:08</div>
        </div>
        <div class="row">
            <div class="label">订单编号</div>
            <div class="value">XB-sell25111403786001</div>
        </div>
        <div class="row">
            <div class="label">产品交割单</div>
            <div class="value link">查看</div>
        </div>
        <div class="row">
            <div class="label">产品编号</div>
            <div class="value">#0002</div>
        </div>
    </div>

</div>
</body>
</html>
